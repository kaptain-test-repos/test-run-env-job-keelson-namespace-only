apiVersion: kaptain.org/1.2
kind: kubernetes-run-environment
spec:
  global:
    projectName:
      stripRepositoryNamePrefix: test
  contents:
    - kubernetes-build-product:[1.0,2.0)
    # Vendor bundle carries cluster-scoped resources (CRDs, ClusterRoles) so
    # this env has real cluster-scoped content to bubble up to the RP parent,
    # and sensitive kinds for the sign-off pass to gate.
    - kubernetes-bundle-vendor-helm-rendered:[1.0.3,2.0)
  main:
    environment:
      # job mode requires keelson (keel cannot trigger jobs).
      deployMode: job
      imageAutoUpdateProvider: keelson
      # Not in the draft schema yet: cluster-scoped resources are packaged
      # into the separate on-behalf dir for the RP parent to apply
      # (namespace-only role).
      clusterScopedDelegation: parent
      generateIdealEnvironmentDeployManifests: true
      checksumSecretsTiming: build
      failOnUnreferencedConfigOrSecrets: true
      environmentDeployBaseImage:
        registry: ghcr.io
        namespace: kube-kaptain
        family: trixie-slim
        version: 1.0.13.1.34.1
      # The only repo with cleanup enforcement ON: the others stay dryrun.
      # Coverage: the sparse end of the surface - policy only, with both
      # additionalResources and accumulatingResources omitted entirely, so
      # the default-fill path is exercised rather than always being handed
      # explicit values.
      cleanUp:
        policy: enabled
    hooks:
      preBuild: test-hooks/pre-build.bash
      preTaggingTests: test-hooks/pre-tagging-tests.bash
      postVersionsAndNaming: test-hooks/post-versions-and-naming.bash
      preDockerPrepare: test-hooks/pre-docker-prepare.bash
      postDockerTests: test-hooks/post-docker-tests.bash
      prePackagePrepare: test-hooks/pre-package-prepare.bash
      postPackageTests: test-hooks/post-package-tests.bash
      postBuild: test-hooks/post-build.bash
